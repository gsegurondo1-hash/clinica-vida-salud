# Blueprint de Render: crea la base de datos, la API (Docker) y el sitio estatico.
# En Render: New > Blueprint > seleccione el repositorio.
databases:
  - name: clinica-db
    databaseName: clinica_vida_salud
    user: clinica
    plan: free

services:
  # ---------- Backend (PHP + Apache en Docker) ----------
  - type: web
    name: clinica-vida-salud-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/La_Paz
      - key: DEMO_MODE          # false: el enlace de recuperacion solo llega por correo
        value: "false"
      - key: BREVO_API_KEY      # clave API de Brevo (correos reales)
        sync: false
      - key: MAIL_FROM_EMAIL    # correo remitente verificado en Brevo
        sync: false
      - key: DEMO_PASSWORD
        value: Clinica2026*
      - key: CORS_ORIGIN        # URL del frontend, ej: https://clinica-vida-salud-web.onrender.com
        sync: false
      - key: FRONTEND_URL       # la misma URL del frontend
        sync: false

  # ---------- Frontend (sitio estatico) ----------
  - type: web
    name: clinica-vida-salud-web
    runtime: static
    rootDir: frontend
    buildCommand: sh build.sh
    staticPublishPath: .
    envVars:
      - key: API_URL            # ej: https://clinica-vida-salud-api.onrender.com/api
        sync: false
      - key: MOSTRAR_DEMO
        value: "true"
